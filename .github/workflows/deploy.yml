name: Build, Scan, Push to ECR & Deploy to EC2

on:
  push:
    branches: ["main"]

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-0123456789abcdef0 # Replace with your EC2 Instance ID

jobs:
  build-scan-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Immutable Image Tag (Git SHA)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx (Enables BuildKit Cache)
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend Image (with GHA Layer Cache)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/pulse-mern-api:${{ steps.vars.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/pulse-mern-api:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend Image (with GHA Layer Cache)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/pulse-mern-web:${{ steps.vars.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/pulse-mern-web:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Run Trivy Vulnerability Scanner on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/pulse-mern-api:${{ steps.vars.outputs.sha_short }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  deploy-to-ec2:
    needs: build-scan-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via AWS Systems Manager (SSM)
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              'set -e',
              'cd /opt/pulse-mern',
              'aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ needs.build-scan-and-push.outputs.ecr_registry }}',
              'export ECR_REGISTRY=${{ needs.build-scan-and-push.outputs.ecr_registry }}',
              'export IMAGE_TAG=${{ needs.build-scan-and-push.outputs.image_tag }}',
              'docker compose pull nginx-proxy api-server',
              'docker compose up -d --no-build --remove-orphans',
              'docker image prune -f'
            ]" \
            --query "Command.CommandId" --output text)

          echo "Waiting for SSM Command $COMMAND_ID to finish..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ env.EC2_INSTANCE_ID }}"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ env.EC2_INSTANCE_ID }}" --query "StandardOutputContent" --output text
